[project]
name = "agentic-search"
version = "0.2.1"
description = "Agentic search harness: plan, execute, analyze, decide over any datastore with swappable models."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
agentic-search = "agentic_search.server.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
local = ["sentence-transformers>=3.0", "pillow>=10"]
postgres = ["psycopg[binary,pool]>=3.2", "sqlglot>=25,<31"]
mysql = ["aiomysql>=0.2", "sqlglot>=25,<31"]
bigquery = ["google-cloud-bigquery>=3.25", "sqlglot>=25,<31"]
opensearch = ["opensearch-py[async]>=2.6"]
neo4j = ["neo4j>=5.20"]
milvus = ["pymilvus>=2.5,<4"]
gcp = ["google-auth[requests]>=2.29"]
azure = ["azure-identity>=1.17"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "anthropic>=0.40",
  "openai>=1.50",
  "sqlglot>=25,<31",
  "psycopg[binary,pool]>=3.2",
  "aiomysql>=0.2",
  "google-cloud-bigquery>=3.25",
  "opensearch-py[async]>=2.6",
  "neo4j>=5.20",
  "pymilvus>=2.5,<4",
  "google-auth[requests]>=2.29",
  "azure-identity>=1.17",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: calls real network services (skipped by default)",
  "slow: downloads or runs local models",
  "integration: needs docker compose services (AGENTIC_SEARCH_INTEGRATION=1)",
]
addopts = "-m 'not live and not slow and not integration'"
filterwarnings = [
  "ignore:enable_cleanup_closed ignored:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
