# Ignite demo harness config. `*_env` keys read environment variables (library convention).
# Models and prices: Vertex (Agent Platform), global. Run in project ajw-sandbox-497707.
# Planner gemini-4-argon (since 2026-10-30): $2.00 / $10.00 per 1M tokens, the introductory rate
# from third-party price trackers (reported to rise to $4 / $20 on 2026-12-01; check Google's
# pricing page). On the WANDS match questions it took harness P@10 from 0.055 (gemini-3.5-flash)
# to 0.260. It plans slowly, so a request is cut at 45 s (15 s gave timeouts) and retried once.
# reasoning_effort low. Earlier planner: gemini-3.5-flash ($1.50 / $9.00), see tuning-log.md.
driver: {type: vertex, model: gemini-4-argon, project_env: IGNITE_GCP_PROJECT, location: global,
         price_per_mtok: [2.00, 10.00], reasoning_effort: low, request_timeout_s: 45,
         max_retries: 1}
# Judge gemini-3.5-flash-lite ($0.30 / $2.50): ~2.5 s per 30-hit batch with the same hero
# judgments as the larger models. Both modes use the same planner and judge.
judge: {type: vertex, model: gemini-3.5-flash-lite, project_env: IGNITE_GCP_PROJECT,
        location: global, price_per_mtok: [0.30, 2.50], reasoning_effort: low,
        request_timeout_s: 15, max_retries: 1}
# driver: {type: anthropic, model: claude-sonnet-5-5, price_per_mtok: [3.0, 15.0]}
embedder: {type: sentence_transformers, model: BAAI/bge-small-en-v1.5}
fallback_embedder: {type: hash}
# Document embeddings are kept here between runs (git-ignored); delete the file to rebuild.
embedding_cache: public/.cache/embeddings/document-vectors.npz
budget: {max_turns: 4, max_tool_calls: 24, max_seconds: 60, max_cost_usd: 0.50}
typesafe: {type: typesafe, api_key_env: TYPESAFE_API_KEY}
# Same settings for both modes. The judge runs its batches one after another, so a larger
# batch and fewer, smaller tool calls keep one turn's judging to about one model call.
# call_timeout / decider_timeout: the time budget is checked only between turns, so these cap
# how far one stalled turn can overrun it.
settings: {max_calls_per_turn: 6, max_limit: 8, judge_batch_size: 48, call_timeout: 15,
           decider_timeout: 15, steps: true}
