# Ignite demo harness config. `*_env` keys read environment variables (library convention).
# Price: Vertex (Agent Platform) pricing page, looked up 2026-10-29. Introductory global rate,
# valid to 2026-12-31; from 2027-01-01 it is [1.5, 7.5].
# gemini-3.8-flash is served on `global` only. reasoning_effort low: judge calls drop from ~10 s
# to ~6 s with the same judgments ("minimal" is rejected). Calls normally take 2-10 s but
# sometimes stall for 20-60 s, so a request is cut at 15 s and retried up to twice.
driver: {type: vertex, model: gemini-3.8-flash, project_env: IGNITE_GCP_PROJECT, location: global,
         price_per_mtok: [0.75, 3.75], reasoning_effort: low, request_timeout_s: 15,
         max_retries: 2}
# The judge uses a smaller model: gemini-3.8-flash took 6-55 s per judge batch (its latency
# swings a lot), gemini-3.5-flash-lite ~2.5 s with the same judgments on the hero set. Planning
# stays on 3.8-flash, which chains hops; flash-lite did not. Both modes use the same pair.
judge: {type: vertex, model: gemini-3.5-flash-lite, project_env: IGNITE_GCP_PROJECT,
        location: global, price_per_mtok: [0.30, 2.50], reasoning_effort: low,
        request_timeout_s: 15, max_retries: 2}
# driver: {type: anthropic, model: claude-sonnet-5-5, price_per_mtok: [3.0, 15.0]}
embedder: {type: sentence_transformers, model: BAAI/bge-small-en-v1.5}
fallback_embedder: {type: hash}
budget: {max_turns: 4, max_tool_calls: 24, max_seconds: 60, max_cost_usd: 0.50}
typesafe: {type: typesafe, api_key_env: TYPESAFE_API_KEY}
# Same settings for both modes. The judge runs its batches one after another, so a larger
# batch and fewer, smaller tool calls keep one turn's judging to about one model call.
settings: {max_calls_per_turn: 6, max_limit: 8, judge_batch_size: 48}
