# Ignite demo harness config. `*_env` keys read environment variables (library convention).
# Models and prices: Vertex (Agent Platform), global. Run in project ajw-sandbox-497707.
# Planner gemini-4-hydrogen (since 2026-11-25): $1.50 / $7.50 per 1M tokens (third-party price
# trackers; check Google's pricing page). Gemini 4 planner check, WANDS match harness, 20 q:
# hydrogen P@10 0.650 / 0.600 (2 runs, ~30 s, $0.04), argon 0.445 (66 s, $0.06), carbon 0.520,
# neon 0.485 with 7 of 20 errored (tuning-log.md, round 17). reasoning_effort low, cut at 45 s.
# Earlier planners: gemini-4-argon ($2 / $10, 2026-10-30 to 11-25), gemini-3.5-flash.
driver: {type: vertex, model: gemini-4-hydrogen, project_env: IGNITE_GCP_PROJECT, location: global,
         price_per_mtok: [1.50, 7.50], reasoning_effort: low, request_timeout_s: 45,
         max_retries: 1}
# Judge gemini-decision-1 (since 2026-11-25): the Gemini Decisions API, one yes/no probability per
# hit, one call per batch, output not billed ($0.10 per 1M input). WANDS judge test, 720 human-labelled
# pairs: accuracy 0.929 at cut 0.5 vs flash-lite 0.900, finds 92% of Exact matches vs 80%, half the
# cost (tuning-log.md, round 17). Not on Vertex yet: needs an AI Studio key in GEMINI_API_KEY or the
# macOS Keychain item `gemini-api-key` (see decision_judge.py).
judge: {type: gemini_decision, model: gemini-decision-1, api_key_env: GEMINI_API_KEY,
        price_per_mtok: [0.10, 0.0], request_timeout_s: 15, max_retries: 1}
# Earlier judge (and the fallback if AI Studio is down): gemini-3.5-flash-lite ($0.30 / $2.50) on Vertex.
# judge: {type: vertex, model: gemini-3.5-flash-lite, project_env: IGNITE_GCP_PROJECT,
#         location: global, price_per_mtok: [0.30, 2.50], reasoning_effort: low,
#         request_timeout_s: 15, max_retries: 1}
# Answer box in the viewer (not used by search or evals): reads one mode's top 10 and answers.
# gemini-3.5-flash ($1.50 / $9.00): 18 of 18 right on harness hero runs, ~4 s. Flash-lite and
# Argon said "not found" too often (tuning-log.md, round 12).
answer: {type: vertex, model: gemini-3.5-flash, project_env: IGNITE_GCP_PROJECT, location: global,
         price_per_mtok: [1.50, 9.00], reasoning_effort: low, request_timeout_s: 30, max_retries: 1}
# driver: {type: anthropic, model: claude-sonnet-5-5, price_per_mtok: [3.0, 15.0]}
embedder: {type: sentence_transformers, model: BAAI/bge-small-en-v1.5}
fallback_embedder: {type: hash}
# Document embeddings are kept here between runs (git-ignored); delete the file to rebuild.
embedding_cache: public/.cache/embeddings/document-vectors.npz
# 120 s for every mode (retrieval, harness, swarm) since 2026-11-19, so the comparison is fair.
budget: {max_turns: 4, max_tool_calls: 24, max_seconds: 120, max_cost_usd: 0.50}
# Swarm mode: one planner call splits the question into at most max_agents parts; one harness
# agent per part, all at once, each with an even share of `budget` and agent_max_turns turns;
# RRF (k = rrf_k) merges their hits. See docs/superpowers/specs/2026-11-19-ignite-swarm-design.md.
swarm: {max_agents: 4, agent_max_turns: 2, rrf_k: 60}
typesafe: {type: typesafe, api_key_env: TYPESAFE_API_KEY}
# Same settings for both modes. The judge runs its batches one after another, so a larger
# batch and fewer, smaller tool calls keep one turn's judging to about one model call.
# call_timeout / decider_timeout: the time budget is checked only between turns, so these cap
# how far one stalled turn can overrun it.
settings: {max_calls_per_turn: 6, max_limit: 20, judge_batch_size: 48, call_timeout: 15,
           decider_timeout: 15, steps: true}
