<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval vs Harness</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #4a4a4a; --line: #c8c8c8; --panel: #f4f4f4;
    --accent: #0b4f9c; --good: #0a6b2d; --bad: #a3141b; --warn: #7a4b00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 20px; line-height: 1.35;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 14px 20px; border-bottom: 2px solid var(--fg);
  }
  header h1 { font-size: 26px; margin: 0 12px 0 0; }
  select, button, input[type=file] { font: inherit; }
  select { padding: 6px 8px; max-width: 46ch; }
  button {
    padding: 6px 16px; border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  button.primary { background: var(--fg); color: var(--bg); }
  button:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  #question { padding: 10px 20px; font-size: 24px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #banner { display: none; padding: 8px 20px; background: var(--fg); color: var(--bg); font-weight: 600; }
  #replay-bar { display: none; gap: 12px; align-items: center; flex-wrap: wrap; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  section.col { padding: 14px 20px 20px; border-right: 1px solid var(--line); min-width: 0; }
  section.col:last-child { border-right: 0; }
  .col h2 { margin: 0 0 8px; font-size: 24px; display: flex; justify-content: space-between; gap: 12px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; }
  .phases { display: flex; gap: 6px; margin: 6px 0 12px; flex-wrap: wrap; }
  .phase {
    padding: 2px 12px; border: 2px solid var(--line); border-radius: 999px; color: var(--muted);
  }
  .phase.on { border-color: var(--fg); color: var(--fg); font-weight: 700; }
  .phase.on::before { content: "▶ "; }
  .phase.done { color: var(--fg); }
  table.lanes { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .lanes th, .lanes td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  .lanes th { background: var(--panel); text-align: left; font-size: 18px; }
  .lanes th.src { width: 9.5em; }
  .chip { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip::before { content: "● "; color: var(--accent); }
  .chip.err { color: var(--bad); }
  .chip.err::before { content: "✗ "; color: var(--bad); }
  .chip .n { color: var(--muted); }
  .decisions { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; min-height: 1em; }
  .badge {
    border: 2px solid var(--fg); border-left-width: 8px; border-radius: 6px; padding: 4px 10px;
    font-size: 19px;
  }
  .badge b { text-transform: uppercase; letter-spacing: .03em; }
  .badge.stop { border-color: var(--good); }
  .badge.refine, .badge.broaden, .badge.switch_source { border-color: var(--warn); }
  .stepsbox { margin: 8px 0 12px; }
  ol.steps { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  li.step { border: 2px solid var(--line); border-radius: 6px; padding: 2px 10px; color: var(--muted); }
  li.step.done { color: var(--fg); }
  li.step.current { border-color: var(--fg); color: var(--fg); font-weight: 700; }
  li.step .now { text-transform: uppercase; font-size: 18px; margin-left: 4px; }
  ul.facts { margin: 0; padding-left: 1.4em; list-style: none; }
  ul.facts li { margin: 2px 0; }
  .error { color: var(--bad); font-weight: 700; margin: 8px 0; }
  ol.hits { margin: 6px 0 12px; padding-left: 1.6em; }
  ol.hits li { margin: 3px 0; }
  .hit-src { color: var(--muted); font-size: 18px; }
  .rel { font-weight: 700; }
  .gold { font-weight: 700; color: var(--good); }
  .hits-head { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 0; font-size: 19px; }
  .hits-head b { font-size: 21px; }
  ol.hits li.is-gold { border-left: 6px solid var(--good); padding-left: 8px; margin-left: -14px; }
  .hit-title { font-weight: 600; }
  .snip { display: block; color: var(--muted); font-size: 17px; line-height: 1.3; }
  .answer {
    border: 2px solid var(--fg); border-radius: 8px; padding: 8px 12px; margin: 12px 0 4px;
    background: var(--panel);
  }
  .answer .label { display: block; color: var(--muted); font-size: 17px; }
  .answer .text { font-size: 24px; font-weight: 700; }
  .answer.right { border-color: var(--good); border-left-width: 10px; }
  .answer.wrong { border-color: var(--bad); border-left-width: 10px; }
  .answer .verdict { display: block; font-size: 19px; font-weight: 700; margin-top: 2px; }
  .answer ol.why { margin: 6px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 16px; line-height: 1.3; }
  .answer.right .verdict { color: var(--good); }
  .answer.wrong .verdict { color: var(--bad); }
  footer.metrics {
    display: grid; grid-template-columns: repeat(5, auto); gap: 4px 16px; border-top: 2px solid var(--fg);
    padding-top: 8px; font-variant-numeric: tabular-nums;
  }
  footer.metrics span { color: var(--muted); font-size: 18px; display: block; }
  footer.metrics strong { font-size: 24px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Retrieval vs Harness</h1>
  <div id="live-bar">
    <label>Question <select id="q-select"></select></label>
    <button id="run" class="primary">Run</button>
  </div>
  <div id="replay-bar">
    <input type="file" id="files" multiple accept=".jsonl,.json">
    <button id="play" disabled>Play</button>
    <button id="pause" disabled>Pause</button>
    <label>Speed <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  </div>
  <div class="spacer"></div>
  <button id="switch">Switch to replay</button>
</header>
<div id="banner"></div>
<div id="question">Pick a question and press Run.</div>
<main>
  <section class="col" id="col-retrieval"></section>
  <section class="col" id="col-harness"></section>
</main>
<script>
/* <core> */
// One source (wiki), so the swimlane rows are the tools: what the agent chose to use, per turn.
const TOOLS = ["lexical_search", "vector_search", "filter_search", "fetch"];

/** Swimlane rows: the known tools in order, then any other tool name the calls used. */
function laneNames(calls) {
  const extra = calls.map((c) => c.name).filter((n) => !TOOLS.includes(n));
  return [...TOOLS, ...new Set(extra)];
}

function filterLabel(f) {
  if (!f || typeof f !== "object") return "";
  if (Array.isArray(f.clauses)) return f.clauses.map(filterLabel).join(" & ");
  if ("value" in f) return `${f.field} = ${f.value}`;
  return `${f.field} ${f.gte ?? ""}…${f.lte ?? ""}`;
}

/** What a call searched for: its text, HyDE text, regex, the ids it fetched, or its filter. */
function chipLabel(args) {
  if (args.text) return args.text;
  if (args.hyde_text) return args.hyde_text;
  if (args.pattern) return `/${args.pattern}/`;
  if (Array.isArray(args.doc_ids)) return args.doc_ids.join(", ");
  return filterLabel(args.filter);
}
const PHASES = ["plan", "query", "judge", "decide"];

/** Split an SSE text buffer into parsed event objects; return the unfinished tail as `rest`. */
function parseSse(buffer) {
  const text = buffer.replace(/\r\n?/g, "\n");
  const frames = text.split("\n\n");
  const rest = frames.pop();
  const events = [];
  for (const frame of frames) {
    const data = [];
    for (const line of frame.split("\n")) {
      if (line.startsWith(":")) continue;
      if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
    }
    if (!data.length) continue;
    try { events.push(JSON.parse(data.join("\n"))); } catch (e) { /* skip a bad frame */ }
  }
  return { events, rest };
}

function initialState(mode) {
  return {
    mode, phase: null, turn: 0, done: false, error: null, calls: [], decisions: [], hits: [], notes: {}, steps: [], current: null, facts: [],
    answer: null, // null | {pending: true} | {answer, correct, expected, gold, error}
    metrics: { turns: 0, toolCalls: 0, seconds: 0, costUsd: 0, stopReason: null },
  };
}

function withUsage(metrics, usage, atMs) {
  const m = { ...metrics };
  if (usage) { m.turns = usage.turns; m.toolCalls = usage.tool_calls; m.costUsd = usage.cost_usd; }
  if (typeof atMs === "number") m.seconds = atMs / 1000;
  return m;
}

/** turn -> controller note, from a final result's trace. Decide events carry the note; this
 *  fallback is for replays saved before they did (trace sent when include_trace is set). */
function notesFromTrace(result) {
  const out = {};
  const events = (result && result.trace && result.trace.events) || [];
  for (const e of events) if (e.type === "decision" && e.data && e.data.note) out[e.turn] = e.data.note;
  return out;
}

/** Fold one event into the column state. Unknown event types leave the state unchanged. */
function reduce(state, ev) {
  switch (ev.type) {
    case "search_started":
      return { ...state, metrics: withUsage(state.metrics, null, ev.at_ms) };
    case "phase_started":
      return { ...state, phase: ev.phase, turn: ev.turn, metrics: withUsage(state.metrics, null, ev.at_ms) };
    case "phase_finished": {
      const s = { ...state, metrics: withUsage(state.metrics, null, ev.at_ms) };
      const sum = ev.summary || {};
      if (ev.phase === "decide" && sum.action) {
        const note = sum.note || state.notes[ev.turn] || "";
        s.decisions = [...state.decisions, { turn: ev.turn, action: sum.action, note }];
      }
      return s;
    }
    case "tool_call_started":
      return { ...state, calls: [...state.calls, {
        id: ev.call_id, turn: ev.turn, source: ev.source, name: ev.name, args: ev.arguments || {},
        atMs: ev.at_ms, nHits: null, error: null }] };
    case "tool_call_finished":
      return { ...state, calls: state.calls.map((c) => c.id !== ev.call_id ? c : {
        ...c, nHits: ev.n_hits, error: ev.error ? `${ev.error.kind}: ${ev.error.message}` : null }) };
    case "steps_updated":
      return { ...state, steps: ev.steps || [], current: ev.current ?? null };
    case "fact_noted":
      return { ...state, facts: [...state.facts, { fact: ev.fact, source_key: ev.source_key }] };
    case "results_updated":
      return { ...state, hits: ev.hits || [] };
    case "usage_updated":
      return { ...state, metrics: withUsage(state.metrics, ev.usage, ev.at_ms) };
    case "search_finished": {
      const m = withUsage(state.metrics, ev.result && ev.result.usage, ev.at_ms);
      m.stopReason = ev.stop_reason;
      const notes = { ...state.notes, ...notesFromTrace(ev.result) };
      const decisions = state.decisions.map((d) => d.note ? d : { ...d, note: notes[d.turn] || "" });
      return { ...state, done: true, phase: null, metrics: m, notes, decisions };
    }
    case "search_failed": {
      const m = withUsage(state.metrics, null, ev.at_ms);
      m.stopReason = "failed";
      return { ...state, done: true, phase: null, error: `${ev.error_type}: ${ev.message}`, metrics: m };
    }
    default:
      return state;
  }
}
const KNOWN_TYPES = new Set(["search_started", "phase_started", "phase_finished", "tool_call_started",
  "tool_call_finished", "results_updated", "usage_updated", "search_finished", "search_failed",
  "steps_updated", "fact_noted"]);

/** Events from a saved run: one JSON event per line. Skips blank, broken and unknown lines. */
function parseJsonl(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    try {
      const ev = JSON.parse(line);
      if (ev && KNOWN_TYPES.has(ev.type)) out.push(ev);
    } catch (e) { /* a run cut short can end in half a line */ }
  }
  return out;
}

/** Playback offsets: each event's delay from the first, divided by `speed`. */
function schedule(events, speed) {
  const t0 = events.length ? events[0].at_ms : 0;
  return events.map((ev) => ({ delayMs: (ev.at_ms - t0) / speed, ev }));
}

/** Sort picked files by name: *-retrieval.jsonl, *-harness.jsonl and an optional *.meta.json. */
function assignFiles(files) {
  const out = { retrieval: null, harness: null, meta: null };
  for (const f of files) {
    if (f.name.endsWith("-retrieval.jsonl")) out.retrieval = f.text;
    else if (f.name.endsWith("-harness.jsonl")) out.harness = f.text;
    else if (f.name.endsWith(".meta.json")) {
      try { out.meta = JSON.parse(f.text); } catch (e) { out.meta = null; }
    }
  }
  return out;
}
/** A live column still running past the spec's 60 s stall line: time to switch to replay. */
function overtime(seconds, done, replay) {
  return !replay && !done && seconds > 60;
}
/** Seconds shown on a column's clock. Finished: the run's final time. Replay: the replay clock,
 *  playing or paused. Live: wall time since the column started. */
function clockSeconds(state, { replay = false, vt = 0, startedMs = null, nowMs = 0 } = {}) {
  if (state.done) return state.metrics.seconds;
  if (replay) return vt / 1000;
  return startedMs == null ? 0 : (nowMs - startedMs) / 1000;
}

/** The question for a replay: the meta file's text, else the run's own search_started event. */
function questionText(meta, events) {
  if (meta && typeof meta.text === "string" && meta.text) return meta.text;
  const started = (events || []).find((e) => e && e.type === "search_started");
  const q = started && started.question;
  if (typeof q === "string") return q;
  const parts = q && Array.isArray(q.content) ? q.content : [];
  return parts.map((c) => (c && typeof c.text === "string" ? c.text : "")).join(" ").trim();
}

/** A replay can start with either mode's file; the other column stays empty. */
function replayable(got) {
  return Boolean(got && (got.retrieval || got.harness));
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** The step strip (done steps get a tick, the current one is labelled "now") and the notebook of
 *  facts. Empty when the run has neither. */
function stepsHtml(state) {
  const steps = state.steps || [];
  const facts = state.facts || [];
  if (!steps.length && !facts.length) return "";
  const items = steps.map((st, i) => {
    const cur = i === state.current;
    const cls = cur ? "step current" : st.done ? "step done" : "step";
    const mark = st.done ? "✓ " : cur ? "▶ " : "○ ";
    return `<li class="${cls}">${mark}${esc(st.text)}${cur ? ' <b class="now">now</b>' : ""}</li>`;
  }).join("");
  const strip = steps.length ? `<ol class="steps">${items}</ol>` : "";
  const notes = facts.map((f) => `<li>✎ ${esc(f.fact)} <span class="hit-src">(from ${esc(f.source_key)})</span></li>`).join("");
  const book = facts.length ? `<ul class="facts">${notes}</ul>` : "";
  return `<div class="stepsbox">${strip}${book}</div>`;
}

const SETS = [
  { id: "musique", label: "MuSiQue (multi-hop Wikipedia)" },
  { id: "wands", label: "WANDS (product search)" },
  { id: "wands-match", label: "WANDS match (our questions)" },
];

/** The question picker's options: one <optgroup> per question set, in SETS order. */
function optionsHtml(questions) {
  return SETS.map((set) => {
    const qs = questions.filter((q) => q.set === set.id);
    if (!qs.length) return "";
    const opts = qs.map((q) => `<option value="${esc(q.id)}">${esc(q.id)} — ${esc(q.text)}</option>`).join("");
    return `<optgroup label="${esc(set.label)}">${opts}</optgroup>`;
  }).join("");
}

/** How many of the gold documents are in the top `k` hits. */
function goldSummary(hits, gold, k = 10) {
  const g = new Set(gold || []);
  const inTop = (hits || []).slice(0, k).filter((h) => g.has(h.doc_id)).length;
  return { inTop, total: g.size };
}

/** One line of a document's text for the results list, cut at a word near `max` characters. The
 *  title is dropped when the text starts with it (MuSiQue paragraphs repeat their title). */
function snippetText(hit, max = 170) {
  let t = String((hit && hit.snippet) || "").replace(/\s+/g, " ").trim();
  const title = String((hit && hit.title) || "").trim();
  if (title && t.toLowerCase().startsWith(title.toLowerCase())) t = t.slice(title.length).trim();
  if (t.length <= max) return t;
  const cut = t.slice(0, max);
  const sp = cut.lastIndexOf(" ");
  return (sp > max * 0.6 ? cut.slice(0, sp) : cut) + " …";
}

/** The answer box: what a reader model answered from this mode's top 10, and (for questions with
 *  a known answer) whether it is right. */
function answerHtml(a) {
  if (!a) return "";
  const label = `<span class="label">Answer, read from this mode's top 10</span>`;
  if (a.pending) return `<div class="answer">${label}<span class="text">…</span></div>`;
  if (a.error && !a.answer) return `<div class="answer">${label}<span class="text">(no answer: ${esc(a.error)})</span></div>`;
  const cls = a.correct === true ? "right" : a.correct === false ? "wrong" : "";
  const verdict = a.correct === true ? `<span class="verdict">✓ correct</span>`
    : a.correct === false ? `<span class="verdict">✗ wrong — the answer is ${esc(a.expected)}</span>` : "";
  const steps = (a.steps || []).map((x) => `<li>${esc(String(x).replace(/^\s*(?:step\s*\d+[:.)]?|\d+[.)]|[-*•])\s*/i, ""))}</li>`).join("");
  const why = steps ? `<ol class="why">${steps}</ol>` : "";
  return `<div class="answer ${cls}">${label}<span class="text">${esc(a.answer)}</span>${verdict}${why}</div>`;
}

/** The POST body for one live run: each question runs on its own corpus's profile. */
function requestBody(q, mode) {
  return JSON.stringify({ profile: q.profile, question: q.text, mode, snapshot_k: 10, include_trace: true });
}
/* </core> */

const MODES = ["retrieval", "harness"];
const TITLES = { retrieval: "Retrieval mode (one pass)", harness: "Harness mode (full loop)" };
const view = { states: {}, started: {}, gold: new Set(), replay: false, timer: null, qid: null };

const $ = (id) => document.getElementById(id);

function shortArgs(args) {
  const shown = Object.entries(args).filter(([k]) => k !== "source" && k !== "collection");
  return shown.map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join(" ");
}

function render(mode) {
  const s = view.states[mode];
  const el = $(`col-${mode}`);
  const maxTurn = Math.max(0, s.turn, ...s.calls.map((c) => c.turn));
  const turns = [...Array(maxTurn + 1).keys()];
  const phaseIdx = PHASES.indexOf(s.phase);
  const phases = PHASES.map((p, i) => {
    const cls = p === s.phase ? "on" : (s.done || (phaseIdx >= 0 && i < phaseIdx)) ? "done" : "";
    return `<span class="phase ${cls}">${p}</span>`;
  }).join(" → ");
  const rows = laneNames(s.calls).map((tool) => {
    const cells = turns.map((t) => {
      const chips = s.calls.filter((c) => c.name === tool && c.turn === t).map((c) => {
        const n = c.error ? "" : c.nHits === null ? " …" : ` <span class="n">(${c.nHits})</span>`;
        const title = esc(c.error || shortArgs(c.args));
        return `<span class="chip ${c.error ? "err" : ""}" title="${title}">${esc(chipLabel(c.args) || c.name)}${n}</span>`;
      }).join("");
      return `<td>${chips}</td>`;
    }).join("");
    return `<tr><th class="src">${tool.replace("_search", "")}</th>${cells}</tr>`;
  }).join("");
  const head = turns.map((t) => `<th>turn ${t + 1}</th>`).join("");
  const decisions = s.decisions.map((d) =>
    `<div class="badge ${esc(d.action)}">after turn ${d.turn + 1}: <b>${esc(d.action.replace("_", " "))}</b>${d.note ? " — " + esc(d.note) : ""}</div>`).join("");
  // Gold is shown in replay, and live once this mode has finished (never mid-run: no giveaway).
  const goldSet = view.replay ? view.gold
    : s.done && s.answer && s.answer.gold ? new Set(s.answer.gold) : null;
  const top = s.hits.slice(0, 10);
  const hits = top.map((h) => {
    const isGold = goldSet && goldSet.has(h.doc_id);
    const rel = h.judged && h.p_relevant != null && h.p_relevant >= 0.5 ? ` <span class="rel">✓ judged relevant</span>` : "";
    const gold = isGold ? ` <span class="gold">★ gold</span>` : "";
    const name = h.title ? `<span class="hit-title">${esc(h.title)}</span>` : `<span class="hit-title">${esc(h.doc_id)}</span>`;
    const snip = snippetText(h);
    return `<li class="${isGold ? "is-gold" : ""}" title="${esc(h.doc_id)}">${name}${gold}${rel}${snip ? `<span class="snip">${esc(snip)}</span>` : ""}</li>`;
  }).join("");
  let hitsHead = `<span>Top ${Math.min(10, top.length) || 10} documents${s.done ? "" : " so far"}</span>`;
  if (goldSet && goldSet.size) {
    const g = goldSummary(top, [...goldSet]);
    hitsHead += `<b class="gold">★ ${g.inTop} of ${g.total} gold in top 10</b>`;
  }
  const m = s.metrics;
  const missing = view.replay && player.runs && !player.runs[mode].length
    ? `<div class="empty">No saved file for this mode.</div>` : "";
  el.innerHTML = `
    <h2><span>${TITLES[mode]}</span><span class="clock" id="clock-${mode}"></span></h2>
    <div class="error" id="overtime-${mode}" hidden>⚠ Past 60 s. Switch to replay?</div>
    ${missing}
    <div class="phases">${phases}</div>
    <table class="lanes"><thead><tr><th class="src">tool</th>${head}</tr></thead><tbody>${rows}</tbody></table>
    <div class="decisions">${decisions}</div>
    ${stepsHtml(s)}
    ${s.error ? `<div class="error">✗ Search failed: ${esc(s.error)}</div>` : ""}
    ${answerHtml(s.answer)}
    <div class="hits-head">${hitsHead}</div>
    <ol class="hits">${hits || `<li class="empty">no results yet</li>`}</ol>
    <footer class="metrics">
      <div><span>turns</span><strong>${m.turns}</strong></div>
      <div><span>tool calls</span><strong>${m.toolCalls}</strong></div>
      <div><span>seconds</span><strong>${m.seconds.toFixed(1)}</strong></div>
      <div><span>cost</span><strong>$${m.costUsd.toFixed(4)}</strong></div>
      <div><span>stop</span><strong>${esc(m.stopReason || (s.done ? "" : "running"))}</strong></div>
    </footer>`;
  renderClock(mode);
}

/** Update only the clock and the overtime cue, so ticks don't rebuild the column (and its
 *  hover tooltips) between events. */
function renderClock(mode) {
  const s = view.states[mode];
  const secs = clockSeconds(s, { replay: view.replay, vt: player.vt, startedMs: view.started[mode],
                                 nowMs: performance.now() });
  $(`clock-${mode}`).textContent = `${secs.toFixed(1)} s`;
  $(`overtime-${mode}`).hidden = !overtime(secs, s.done, view.replay);
}

function reset() {
  for (const mode of MODES) { view.states[mode] = initialState(mode); view.started[mode] = null; render(mode); }
}

function startClock() {
  clearInterval(view.timer);
  view.timer = setInterval(() => {
    for (const mode of MODES) if (!view.states[mode].done && view.started[mode]) renderClock(mode);
    if (MODES.every((m) => view.states[m].done)) clearInterval(view.timer);
  }, 100);
}

function apply(mode, ev) {
  const wasDone = view.states[mode].done;
  view.states[mode] = reduce(view.states[mode], ev);
  render(mode);
  if (!wasDone && view.states[mode].done && !view.states[mode].error) fetchAnswer(mode);
}

/** When a mode finishes: ask the server for an answer read from its top 10 (and, live, the gold
 *  list). Needs the server; a replay opened from disk has no answer line. */
async function fetchAnswer(mode) {
  if (location.protocol === "file:" || !view.qid) return;
  const s = view.states[mode];
  const keys = s.hits.slice(0, 10).map((h) => h.key || `${h.source}:${h.doc_id}`);
  const runId = view.runId;
  s.answer = { pending: true };
  render(mode);
  let a;
  try {
    const r = await fetch("/ignite/answer", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ id: view.qid, keys, notes: (s.facts || []).map((f) => f.fact) }) });
    a = r.ok ? await r.json() : { error: `HTTP ${r.status}` };
  } catch (e) {
    a = { error: e.message };
  }
  if (view.runId !== runId) return; // a newer run started meanwhile
  view.states[mode].answer = a;
  render(mode);
}

function banner(text) {
  $("banner").textContent = text || "";
  $("banner").style.display = text ? "block" : "none";
}

// ---- live mode ----------------------------------------------------------------
const live = { questions: [], aborts: [] };

async function loadQuestions() {
  try {
    const r = await fetch("/ignite/questions");
    live.questions = await r.json();
    $("q-select").innerHTML = optionsHtml(live.questions);
  } catch (e) {
    banner("Live server not reachable. Use Switch to replay.");
  }
}

async function streamMode(mode, q, signal) {
  view.started[mode] = performance.now();
  try {
    const resp = await fetch("/v1/search/stream", {
      method: "POST", signal, headers: { "Content-Type": "application/json" },
      body: requestBody(q, mode),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
      const { events, rest } = parseSse(buffer);
      buffer = rest;
      for (const ev of events) apply(mode, ev);
      if (done) break;
    }
    if (!view.states[mode].done) apply(mode, { type: "search_failed", error_type: "StreamClosed", message: "the stream ended without a result" });
  } catch (e) {
    if (e.name === "AbortError") return;
    apply(mode, { type: "search_failed", error_type: e.name || "Error", message: e.message });
  }
}

function runLive() {
  const q = live.questions.find((x) => x.id === $("q-select").value);
  if (!q) return;
  stopLive();
  view.replay = false;
  view.qid = q.id;
  view.runId = (view.runId || 0) + 1;
  banner("");
  $("question").textContent = q.text;
  reset();
  startClock();
  live.aborts = MODES.map(() => new AbortController());
  MODES.forEach((mode, i) => streamMode(mode, q, live.aborts[i].signal));
}

function stopLive() {
  live.aborts.forEach((a) => a.abort());
  live.aborts = [];
}

// ---- replay mode --------------------------------------------------------------
// A virtual clock (vt, in the runs' own milliseconds) advances at `speed` times real time; each
// tick applies every event whose offset has passed. Both columns share the clock.
const player = { runs: null, idx: {}, offsets: {}, vt: 0, playing: false, last: 0, timer: null };

function enterReplay() {
  stopLive();
  clearInterval(view.timer);
  view.replay = true;
  $("live-bar").style.display = "none";
  $("replay-bar").style.display = "flex";
  $("switch").style.display = "none";
  banner("Replay: a saved run, played back with its original timing.");
  $("question").textContent = "Load the -retrieval.jsonl and -harness.jsonl files of one run (and its .meta.json).";
  reset();
}

async function loadFiles(fileList) {
  try {
    const files = await Promise.all([...fileList].map(async (f) => ({ name: f.name, text: await f.text() })));
    const got = assignFiles(files);
    if (!replayable(got)) {
      banner("Pick the files of one run: *-retrieval.jsonl and/or *-harness.jsonl (plus .meta.json).");
      return;
    }
    player.runs = { retrieval: got.retrieval ? parseJsonl(got.retrieval) : [],
                    harness: got.harness ? parseJsonl(got.harness) : [] };
    view.gold = new Set((got.meta && Array.isArray(got.meta.gold) && got.meta.gold) || []);
    view.qid = (got.meta && got.meta.question_id) || null;
    $("question").textContent = questionText(got.meta, [...player.runs.harness, ...player.runs.retrieval]);
    banner(`Replay: a saved run, played back with its original timing.${view.gold.size ? " ★ marks the gold documents." : ""}`);
    rewind();
    $("play").textContent = "Play";
    $("play").disabled = false;
  } catch (e) {
    banner(`Could not load these files: ${e.message}`);
  }
}

function rewind() {
  pause();
  view.runId = (view.runId || 0) + 1;
  reset();
  player.vt = 0;
  for (const mode of MODES) {
    const evs = player.runs[mode];
    player.offsets[mode] = schedule(evs, 1);
    player.idx[mode] = 0;
    const fin = evs.find((e) => e.type === "search_finished");
    view.states[mode].notes = fin ? notesFromTrace(fin.result) : {};
  }
}

function tick() {
  const now = performance.now();
  player.vt += (now - player.last) * Number($("speed").value);
  player.last = now;
  let pending = false;
  for (const mode of MODES) {
    const offs = player.offsets[mode];
    const before = player.idx[mode];
    const wasDone = view.states[mode].done;
    while (player.idx[mode] < offs.length && offs[player.idx[mode]].delayMs <= player.vt) {
      view.states[mode] = reduce(view.states[mode], offs[player.idx[mode]].ev);
      player.idx[mode] += 1;
    }
    if (!wasDone && view.states[mode].done && !view.states[mode].error) fetchAnswer(mode);
    if (player.idx[mode] < offs.length) pending = true;
    if (player.idx[mode] !== before) render(mode); else renderClock(mode);
  }
  if (!pending) { pause(); $("play").textContent = "Replay again"; }
}

function play() {
  if (!player.runs) return;
  const finished = MODES.every((m) => player.idx[m] >= player.offsets[m].length);
  if (finished) rewind();
  player.playing = true;
  player.last = performance.now();
  clearInterval(player.timer);
  player.timer = setInterval(tick, 50);
  $("play").textContent = "Play";
  $("play").disabled = true;
  $("pause").disabled = false;
}

function pause() {
  player.playing = false;
  clearInterval(player.timer);
  $("play").disabled = !player.runs;
  $("pause").disabled = true;
}

$("files").addEventListener("change", (e) => loadFiles(e.target.files));
$("play").addEventListener("click", play);
$("pause").addEventListener("click", () => { pause(); $("play").textContent = "Resume"; });
$("run").addEventListener("click", runLive);
$("switch").addEventListener("click", enterReplay);
reset();
if (location.protocol === "file:") enterReplay(); else loadQuestions();
</script>
</body>
</html>
